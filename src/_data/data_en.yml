      start: "2022"
      end: "2019"
      description: |
        Eirik developed and implemented machine learning models for image analysis and NLP in medical applications. He worked on training deep learning models to automatically identify anomalies in X-ray images, leading to a 25% higher accuracy compared to previous methods.

        Examples of work:

        * Developed and trained CNN models to classify and identify medical images.
        * Improved image data preprocessing, reducing computation time by 30%.
        * Implemented a hybrid model combining traditional image processing with deep learning.
        * Created an internal dashboard to visualize model performance and error analysis.
        
        He also built an NLP-based chatbot for patient communication, which streamlined the customer support process. He used TensorFlow, PyTorch, and AWS Lambda to deploy models in production environments.
