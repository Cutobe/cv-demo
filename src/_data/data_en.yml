      description: |
        Eirik built modern web applications for clients in e-commerce and logistics. He was responsible for developing RESTful APIs with Spring Boot and creating responsive interfaces in React.

        He also introduced a new caching layer with Redis, which reduced page load times by 40%. He participated in agile development using Scrum and worked closely with clients to tailor solutions to their needs.

        During his time at FjordSoft, he worked on migrating an older monolithic system to a more modular microservices architecture. He designed and implemented new APIs, enabling easier integration with external services. By using PostgreSQL and index optimization, he significantly improved database performance.

        Eirik was also responsible for introducing unit testing and code reviews into the development process, which improved code quality and reduced the number of bugs in production. He held regular technical workshops for the team, where he shared insights on best practices and new technologies.
      techstack: "Java, Spring Boot, React, Redux, PostgreSQL, Redis, Docker, Jenkins"
