    - title: "Lead Fullstack Developer"
      company: "Nordic Tech Solutions"
      start: "2022"
      end: ""
      description: |
        Eirik leads the development of a scalable SaaS platform for fintech used by banks and payment service providers. He is responsible for system architecture and technical guidance within the team, with a focus on microservices and distributed systems in a cloud-based environment.
        He has implemented solutions with React and TypeScript on the frontend, and Spring Boot and Kotlin on the backend. He has optimized API performance and introduced GraphQL for more flexible data queries.

        Examples of work:

        * Designed and implemented a new GraphQL-based API structure for more efficient data retrieval.
        * Migrated an older system from monolith to microservices, improving scalability and maintainability.

        He also drives DevOps and CI/CD initiatives through Kubernetes and GitHub Actions.
      techstack: "Kotlin, Spring Boot, React, TypeScript, GraphQL, PostgreSQL, AWS, Kubernetes, GitHub Actions"
    - title: "Machine Learning Engineer"
